name: Regression checks

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adoption-postgres:
    # The purchase/settlement lock ordering needs a real database; the host
    # suites use an in-memory fake. Service containers run only on Linux.
    name: Adoption concurrency (PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: houdini
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d houdini"
          --health-interval 3s --health-timeout 3s --health-retries 40
    steps:
      - name: Check out owned source without media submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Python (the Houdini image runs 3.11)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install asyncpg at the Houdini image's version
        run: python -m pip install --disable-pip-version-check 'asyncpg==0.32.0'

      - name: Load the vendored Houdini schema
        env:
          PGPASSWORD: ci-only-disposable
        run: psql -v ON_ERROR_STOP=1 -q -h 127.0.0.1 -U postgres -d houdini -f houdini/houdini.sql > /dev/null

      - name: Test purchase and settlement against PostgreSQL
        env:
          CP_ADOPTION_PG_DSN: postgresql://postgres:ci-only-disposable@127.0.0.1:5432/houdini
        run: python -B local/test_adoption_postgres.py

  regression:
    name: Regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Check out owned source without media submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            local/engine/package-lock.json
            local/web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Report Git version (the engine requires Git 2.48 or newer)
        run: git --version

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --prefix local/engine
          npm ci --ignore-scripts --prefix local/web

      - name: Check launcher syntax
        run: |
          for file in local/start local/stop local/compose local/verify local/agent-start local/bridge-fixtures local/adoption-db-check local/doctor launch local/controller/build-supervise.sh; do
            sh -n "$file"
          done
          bash -n local/web/setup-ruffle.sh macos/scripts/build-app.sh macos/scripts/make-dmg.sh macos/scripts/notarize.sh

      - name: Test agent engine with disposable repositories and fake PTYs
        run: npm test --prefix local/engine

      - name: Test browser wrapper and UI contracts
        run: npm test --prefix local/web

      - name: Test game bridge contracts
        run: node --test local/client-bridge/*.test.mjs

      - name: Test SWF preservation and stale-overlay rejection
        # The real generated-overlay test is expected to skip on a source-only checkout.
        run: python3 -m unittest discover -v -s local/client-bridge -p 'test_*.py'

      - name: Test game provisioning and native igloo adapter host logic
        # Compiles the vendored upstream handlers from source; no Houdini dependencies or database.
        run: python3 -m unittest -v local/test_game_provision.py local/test_native_igloos.py local/test_project_adoption.py

      - name: Test the read-only setup doctor against a fake host
        run: python3 -m unittest -v local/test_doctor.py

      - name: Test native service definitions and their adapters (no runtimes built)
        run: |
          node --test local/native/*.test.mjs
          python3 -m unittest -v local/test_native_adapters.py

      - name: Test verified downloads and Claude Code release verification (offline fixtures)
        run: node --test local/installer/

      - name: Test the app controller and supervisor with fake services
        # The supervisor shim uses kqueue and libproc, so it builds only on macOS.
        if: runner.os == 'macOS'
        run: node --test local/controller/

      - name: Check whitespace
        # On pull requests HEAD is GitHub's merge commit; compare against its base parent.
        run: git diff --check HEAD^ HEAD

      - name: Describe coverage limits
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          These checks use fake Claude PTYs, temporary repositories and worktrees, local HTTP/socket
          fixtures, client contract doubles, synthetic SWF preservation and stale-overlay rejection, and host tests
          for game provisioning, the native igloo adapter and the setup doctor (against a fake host). The macOS app's
          native-service definitions, extension patcher, installer (offline fixtures) and, on macOS, the controller
          and supervisor (fake services) are tested; the Swift app, the built runtimes, real Claude downloads and the
          native game servers are not exercised here. The separate Linux job runs the
          adoption purchase/settlement transactions against a PostgreSQL 16 service with the
          vendored schema, not against the running game server.
          The generated-overlay preservation test skips because this job does not
          download the pinned media archive or build the overlay.

          Live Claude execution/permissions, the real overlay build and preservation,
          Houdini container regressions, game-server checks, and interactive gameplay
          remain separate checks documented in `local/VALIDATION.md` and `local/AGENTS.md`.
          EOF

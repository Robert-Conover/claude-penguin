<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="banner-title banner-description">
  <title id="banner-title">Claude Penguin — Your agents. A little more alive.</title>
  <desc id="banner-description">Original concept art of a penguin with a golden laptop and three colorful, fluffy companions on a snowy island at twilight. A quiet constellation, warm cabin windows, and a winding trail illuminate the scene. Agent integration is planned.</desc>

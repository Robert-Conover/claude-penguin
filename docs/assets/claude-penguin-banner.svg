      <stop offset="1" stop-color="#cf9159"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#a9e0c8"/>
      <stop offset="1" stop-color="#5da89f"/>
    </linearGradient>
    <linearGradient id="lilac" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#c0b3e5"/>
      <stop offset="1" stop-color="#8b83b9"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="0" y2="1">

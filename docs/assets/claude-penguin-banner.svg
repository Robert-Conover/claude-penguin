      <stop stop-color="#10273c"/>
      <stop offset=".58" stop-color="#19384d"/>
      <stop offset="1" stop-color="#3d5361"/>
    </linearGradient>
    <radialGradient id="horizon" cx=".75" cy=".6" r=".7">
      <stop stop-color="#dfb486" stop-opacity=".27"/>
      <stop offset=".62" stop-color="#86c5c5" stop-opacity=".07"/>
      <stop offset="1" stop-color="#86c5c5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f1f4e9"/>
      <stop offset="1" stop-color="#c6dede"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#94bdc8"/>
      <stop offset="1" stop-color="#466d83"/>
